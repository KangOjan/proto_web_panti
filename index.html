<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    SIMK-Panti - Sistem Informasi Manajemen Keuangan Panti Asuhan
  </title>

  <meta
    name="description"
    content="Sistem Informasi Manajemen Keuangan Panti Asuhan berbasis Akuntabilitas & Transparansi Nirlaba."
  />

  <link
    rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>"
  />

  <!-- Google Fonts -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CSS
       Prototype only.
       Must be compiled before production deployment. -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: [
              '"Plus Jakarta Sans"',
              'sans-serif'
            ],
          },

          colors: {
            emerald: {
              50: '#ecfdf5',
              100: '#d1fae5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
              950: '#022c22'
            },

            teal: {
              50: '#f0fdfa',
              100: '#ccfbf1',
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
              800: '#115e59',
              900: '#134e4a'
            },

            indigo: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81'
            }
          }
        }
      }
    };
  </script>

  <!-- Chart.js -->
  <script
    src="https://cdn.jsdelivr.net/npm/chart.js"
  ></script>

  <!-- Lucide -->
  <script
    src="https://unpkg.com/lucide@latest"
  ></script>

  <!-- Application Styles -->
  <link
    rel="stylesheet"
    href="css/custom.css?v=5.0"
  />

  <!-- React -->
  <script
    src="https://unpkg.com/react@18/umd/react.production.min.js"
    crossorigin
  ></script>

  <script
    src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    crossorigin
  ></script>

  <!-- Babel
       Prototype only.
       Remove during production build migration. -->
  <script
    src="https://unpkg.com/@babel/standalone/babel.min.js"
  ></script>

  <!-- Prototype data for domains
       that have not been connected
       to the backend yet. -->
  <script
    src="js/data/mockData.js?v=5.0"
  ></script>
</head>

<body
  class="bg-slate-50 text-slate-800 antialiased selection:bg-emerald-500 selection:text-white min-h-screen flex flex-col"
>

  <div id="root"></div>

  <!--
    Runtime configuration.

    API URL is public configuration,
    NOT a secret.

    Midtrans Server Key and other
    server-side credentials MUST NEVER
    be stored here.
  -->
  <script>
    window.SIMK_CONFIG =
      Object.freeze({
        API_BASE_URL:
          'http://127.0.0.1:8000/api/v1'
      });
  </script>

  <!-- Backend API Layer -->
  <script
    src="js/api/apiClient.js?v=1.1"
  ></script>

  <script
    src="js/api/authApi.js?v=1.1"
  ></script>

  <script
    src="js/api/campaignApi.js?v=1.1"
  ></script>

  <script
    src="js/api/donationApi.js?v=1.0"
  ></script>

  <script
    src="js/api/paymentApi.js?v=1.0"
  ></script>

  <!-- React-safe Lucide wrapper -->
  <script
    type="text/babel"
    src="js/components/LucideIcon.jsx?v=1.0"
  ></script>

  <!-- Public Components -->
  <script
    type="text/babel"
    src="js/public/LandingPage.jsx?v=5.0"
  ></script>

  <script
    type="text/babel"
    src="js/public/OrganizationProfile.jsx?v=5.0"
  ></script>

  <script
    type="text/babel"
    src="js/public/PublicFinancialDashboard.jsx?v=5.0"
  ></script>

  <!-- Shared Components -->
  <script
    type="text/babel"
    src="js/components/Navbar.jsx?v=5.0"
  ></script>

  <script
    type="text/babel"
    src="js/components/AuthPages.jsx?v=5.0"
  ></script>

  <script
    type="text/babel"
    src="js/components/DigitalReceiptModal.jsx?v=5.0"
  ></script>

  <script
    type="text/babel"
    src="js/components/Modals.jsx?v=5.0"
  ></script>

  <!-- Pengurus Components -->
  <script
    type="text/babel"
    src="js/admin/UserApproval.jsx?v=5.0"
  ></script>

  <script
    type="text/babel"
    src="js/admin/TransactionManagement.jsx?v=5.0"
  ></script>

  <script
    type="text/babel"
    src="js/admin/ProgramManagement.jsx?v=5.0"
  ></script>

  <script
    type="text/babel"
    src="js/admin/AuditTrailLog.jsx?v=5.0"
  ></script>

  <script
    type="text/babel"
    src="js/admin/FinancialDashboard.jsx?v=5.0"
  ></script>

  <script
    type="text/babel"
    src="js/admin/FinancialReportPSAK45.jsx?v=5.0"
  ></script>

  <script
    type="text/babel"
    src="js/admin/PublicDonation.jsx?v=5.0"
  ></script>

  <!-- Application -->
  <script
    type="text/babel"
    src="js/app.jsx?v=5.1"
  ></script>

  <script type="text/babel">
    const container =
      document.getElementById(
        'root'
      );

    const root =
      ReactDOM.createRoot(
        container
      );

    root.render(
      <App />
    );
  </script>

</body>
</html>
